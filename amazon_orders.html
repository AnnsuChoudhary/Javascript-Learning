<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="amazon.css">
    <link rel="stylesheet" href="amazon_orders.css">
</head>
<body>
    <header>
        <div class="navbar">
            <div class="nav-logo border">
                <a href="amazon.html" class="logo-link">
                    <div class="logo"></div>
                </a>
            </div>
            <div class="nav-search">
                <select class="search-select">
                    <option>All</option>
                </select>
                <input placeholder="Search Amazon" class="search-input">
                <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="nav-cart border">
                <a href="amazon_cart.html" class="nav-cart-link">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Cart</span>
                    <span class="cart-count-badge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="orders-page">
        <section class="orders-sidebar">
            <div class="orders-card">
                <h2>Your Account</h2>
                <ul>
                    <li><a href="amazon_cart.html">Cart</a></li>
                    <li><a href="amazon_checkout.html">Checkout</a></li>
                    <li><a href="amazon_orders.html" class="active">Orders</a></li>
                </ul>
            </div>
        </section>

        <section class="orders-content">
            <div class="orders-card">
                <div class="orders-header">
                    <div>
                        <p class="orders-tag">Your Orders</p>
                        <h1>Order history</h1>
                    </div>
                    <a href="amazon.html" class="continue-shop">Continue shopping</a>
                </div>
                <div id="orders-list" class="orders-list"></div>
            </div>
        </section>
    </main>

    <script type="module" src="amazon.js"></script>
    <script type="module" src="amazon_orders.js"></script>
</body>
</html>
